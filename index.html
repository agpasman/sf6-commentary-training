<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>スト6サポートツールAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@500;800&family=Shippori+Mincho:wght@600&family=Yomogi&family=Reggae+One&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261118-8">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">スト6 サポートツール<b>AG</b></div>
    <nav aria-label="機能">
      <a href="#zukan" data-tab="zukan">技図鑑</a>
      <a href="#combo" data-tab="combo">コンボ</a>
      <a href="#quiz" data-tab="quiz">クイズ</a>
      <a href="#match" data-tab="match">試合で実況練習</a>
      <a href="#data" data-tab="data">データ管理</a>
    </nav>
    <div class="hright">
      <div class="seg" id="ctrlmode" role="group" aria-label="操作タイプ"><button data-ct="classic" aria-pressed="true">クラシック</button><button data-ct="modern" aria-pressed="false">モダン</button></div>
      <div class="seg" id="notation" role="group" aria-label="操作の表記"><button data-nt="num" aria-pressed="true" title="236P のような数字の表記">テンキー</button><button data-nt="icon" aria-pressed="false" title="矢印とボタンのアイコン表記">アイコン</button></div>
      <span class="pill" id="editPill" hidden>編集モード</span>
      <span class="pill warn" id="dirtyPill" hidden title="このブラウザに未公開の変更があります">未公開の変更あり</span>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="data.js?v=20261118-8"></script>
<script src="flow.js?v=20261118-8"></script>
<script src="combo.js?v=20261118-8"></script>
<script src="app.js?v=20261118-8"></script>
</body>
</html>
